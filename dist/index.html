<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <form id="add-post-form">
                <input id="post-title" type="text" placeholder="Post title" />
                <textarea id="post-content" placeholder="Post content"></textarea>
                <input type="submit" class="add-post-btn" value="Add Post" />
                <p class="form-message"></p>
            </form>
            <h2>Posts</h2>
            <div class="posts-section"></div>
        </div>

        <script src="main.bundle.js" type="module"></script>
    </body>
</html>
